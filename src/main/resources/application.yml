spring:
  application:
    name: nimble-gateway

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  security:
    jwt:
      secret: ${JWT_SECRET:sQf9n1R0v8k3tF2mY6WzXQ9uA4dJpOeR2bVhK3L1T0M=POWDPoONOIoijNKlknoi}
      expiration: 86400000      # 24 horas em milissegundos
      issuer: nimble-gateway-api

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
  servlet:
    context-path: /nimble-gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  info:
    title: Nimble Gateway API
    description: API de gateway de pagamentos — desafio técnico Nimble.
    version: 1.0.0

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    br.com.gatewaynimble.avaliacao_nimble: INFO

app:
  authorizer:
    mock-mode: true